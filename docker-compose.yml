services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi:
    build: ./fastapi
    environment:
      DATABASE_URL: postgresql+psycopg2://app:app@db:5432/appdb
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  pyramid:
    build: ./pyramid
    environment:
      DATABASE_URL: postgresql+psycopg2://app:app@db:5432/appdb
    ports:
      - "6543:6543"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
