apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: frameworks

resources:
  - namespace.yaml
  - postgres.yaml
  - fastapi.yaml
  - pyramid.yaml
  - base-app.yaml
  - ingress.yaml

# Copy of ../../database/schema.sql (source of truth) — kustomize cannot
# reference files outside its root. The hash suffix rolls postgres on change.
configMapGenerator:
  - name: db-init
    files:
      - schema.sql
