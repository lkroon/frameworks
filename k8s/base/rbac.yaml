# Lets the fastapi pod scale itself (dashboard slider) and nothing else:
# the Role is scoped to one verb pair on one named deployment's scale
# subresource.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fastapi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fastapi-scaler
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["fastapi"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fastapi-scaler
subjects:
  - kind: ServiceAccount
    name: fastapi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fastapi-scaler
